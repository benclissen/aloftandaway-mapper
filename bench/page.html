<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mapper render-speed benchmark</title>
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  /* No page background, so a CDP screenshot can be transparent where nothing is drawn. */
  html, body { margin: 0; padding: 0; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #map, #overlay { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <canvas id="overlay"></canvas>
</div>
<script type="module">
import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';

// Benchmark only: the style is fetched at runtime and never stored in the repo.
const STYLE = 'https://tiles.openfreemap.org/styles/positron';
const PIRAEUS = { center: [23.6466, 37.942], zoom: 6 };
const RHODES = { center: [28.2278, 36.451], zoom: 8 };

const params = new URLSearchParams(location.search);
const pixelRatio = Number(params.get('pixelRatio') ?? 1);
// How many vertices the route has, and how far (in metres) each is jittered off the straight line. The defaults are the
// plain 256-point line; the recorded-track case asks for 10,000 points with noise.
const ROUTE_POINTS = Number(params.get('routePoints') ?? 256);
const NOISE_METRES = Number(params.get('noise') ?? 0);
// A fixed zoom for the whole sweep, instead of 6 to 8. At 11 or 12 the tiler keeps the jitter instead of simplifying it away.
const FIXED_ZOOM = params.has('zoom') ? Number(params.get('zoom')) : undefined;

const map = new maplibregl.Map({
  container: 'map',
  style: STYLE,
  center: PIRAEUS.center,
  zoom: PIRAEUS.zoom,
  pixelRatio,
  maxCanvasSize: [8192, 8192],
  fadeDuration: 0,
  attributionControl: false,
  interactive: false,
  canvasContextAttributes: { preserveDrawingBuffer: true },
});

const lerp = (a, b, t) => a + (b - a) * t;
const lerpPoint = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

// A Piraeus → Rhodes line, densified so setData carries a realistic vertex count. With noise, every vertex is moved by
// up to NOISE_METRES east and north, like a logged track (a seeded generator, so every run draws the same line).
let seed = 1;
const rand = () => {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 2 ** 32;
};
const M_PER_DEG = 111320;
const route = Array.from({ length: ROUTE_POINTS }, (_, k) => {
  const [lng, lat] = lerpPoint(PIRAEUS.center, RHODES.center, k / (ROUTE_POINTS - 1));
  if (!NOISE_METRES || k === 0 || k === ROUTE_POINTS - 1) return [lng, lat];
  return [
    lng + ((rand() * 2 - 1) * NOISE_METRES) / (M_PER_DEG * Math.cos((lat * Math.PI) / 180)),
    lat + ((rand() * 2 - 1) * NOISE_METRES) / M_PER_DEG,
  ];
});

function routeTo(t) {
  const end = t * (ROUTE_POINTS - 1);
  const whole = Math.floor(end);
  const coords = route.slice(0, whole + 1);
  if (end > whole) coords.push(lerpPoint(route[whole], route[whole + 1], end - whole));
  if (coords.length < 2) coords.push(coords[0]);
  return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
}

const mapCanvas = map.getCanvas();
const gl = mapCanvas.getContext('webgl2');

// A stand-in for the signs layer: a 2D canvas the size of the map canvas.
const overlay = document.getElementById('overlay');
overlay.width = mapCanvas.width;
overlay.height = mapCanvas.height;
const overlayCtx = overlay.getContext('2d');
overlayCtx.scale(pixelRatio, pixelRatio);
overlayCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
overlayCtx.fillRect(80, 900, 420, 100);
overlayCtx.fillStyle = '#1d2b3a';
overlayCtx.font = '600 56px sans-serif';
overlayCtx.fillText('Rhodes', 110, 970);
// A semi-transparent coloured shape with anti-aliased edges, for the alpha comparison.
overlayCtx.fillStyle = 'rgba(30, 110, 255, 0.45)';
overlayCtx.beginPath();
overlayCtx.arc(1500, 300, 180, 0, 2 * Math.PI);
overlayCtx.fill();

const composite = document.createElement('canvas');
composite.width = mapCanvas.width;
composite.height = mapCanvas.height;
const compositeCtx = composite.getContext('2d');

const pixels = new Uint8Array(mapCanvas.width * mapCanvas.height * 4);
let last = pixels;
const sockets = new Map();

function idle() {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('map did not go idle within 60 s')), 60_000);
    map.once('idle', () => { clearTimeout(timer); resolve(); });
  });
}

function socket(url) {
  if (!sockets.has(url)) {
    sockets.set(url, new Promise((resolve, reject) => {
      const ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => resolve(ws);
      ws.onerror = () => reject(new Error(`WebSocket ${url} failed`));
    }));
  }
  return sockets.get(url);
}

function drained(ws) {
  return new Promise((resolve) => {
    const check = () => (ws.bufferedAmount === 0 ? resolve() : setTimeout(check, 0));
    check();
  });
}

const cpuMs = [];

window.bench = {
  ready: new Promise((resolve) => map.once('load', () => {
    map.addSource('route', { type: 'geojson', data: routeTo(0) });
    map.addLayer({
      id: 'route',
      type: 'line',
      source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#d9472b', 'line-width': 6 },
    });
    resolve();
  })),

  size: () => [mapCanvas.width, mapCanvas.height],

  async frame(i, n) {
    const t = i / n;
    const start = performance.now();
    const settled = idle();
    map.jumpTo({ center: lerpPoint(PIRAEUS.center, RHODES.center, t), zoom: FIXED_ZOOM ?? lerp(PIRAEUS.zoom, RHODES.zoom, t) });
    const built = performance.now();
    map.getSource('route').setData(routeTo(t));
    cpuMs.push(performance.now() - built);
    await settled;
    return performance.now() - start;
  },

  /** Main-thread time of each frame's route slice and setData call so far, in ms. It doesn't include the worker's tiling. */
  cpu() {
    return cpuMs.splice(0);
  },

  /** Turns the map into a transparent route layer: basemap hidden, line at 60% opacity. */
  async transparent() {
    const settled = idle();
    for (const layer of map.getStyle().layers) {
      if (layer.id !== 'route') map.setLayoutProperty(layer.id, 'visibility', 'none');
    }
    map.setPaintProperty('route', 'line-color', '#ff2a00');
    map.setPaintProperty('route', 'line-opacity', 0.6);
    await settled;
  },

  readPixelsGL() {
    const start = performance.now();
    gl.readPixels(0, 0, mapCanvas.width, mapCanvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    last = pixels;
    return performance.now() - start;
  },

  readComposite() {
    const start = performance.now();
    compositeCtx.clearRect(0, 0, composite.width, composite.height);
    compositeCtx.drawImage(mapCanvas, 0, 0);
    compositeCtx.drawImage(overlay, 0, 0);
    last = compositeCtx.getImageData(0, 0, composite.width, composite.height).data;
    return performance.now() - start;
  },

  async sendWS(url) {
    const ws = await socket(url);
    const start = performance.now();
    ws.send(last);
    await drained(ws);
    return performance.now() - start;
  },

  base64() {
    return new Uint8Array(last.buffer, last.byteOffset, last.byteLength).toBase64();
  },

  webgl() {
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    return info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  },
};
</script>
</body>
</html>
